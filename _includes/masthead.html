<header class="armor-header">
  <div class="armor-header-inner">
    <a class="armor-brand" href="{{ '/' | relative_url }}" aria-label="ARMOR Lab home">ARMOR<span>LAB</span><small>GEORGIA SOUTHERN UNIVERSITY</small></a>
    <nav class="armor-nav" aria-label="Main navigation">
      {% for link in site.data.navigation.main %}
      <a href="{% if link.url contains 'https://' %}{{ link.url }}{% else %}{{ link.url | relative_url }}{% endif %}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
